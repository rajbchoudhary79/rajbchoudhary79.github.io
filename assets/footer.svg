<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d14"/><stop offset="1" stop-color="#161a2b"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
<style>.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}
.pop{animation:pop .6s ease-out both}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spin{transform-origin:450px 178px;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style></defs>
<rect x="1" y="1" width="898" height="208" rx="16" fill="url(#bg)" stroke="#ff4d2e" stroke-opacity=".35" stroke-width="2"/>
<text x="450" y="60" text-anchor="middle" class="m" font-size="12" letter-spacing="3" fill="#ff8a3d">// MISSION BOARD</text>
<text x="32" y="68" class="t" font-size="22" font-weight="700" fill="#f5f7ff"></text>
<rect x="426" y="80" width="0" height="3" rx="1.5" fill="url(#red)"/>
<text x="450" y="110" text-anchor="middle" class="t" font-size="30" font-weight="800" fill="url(#red)">Let's build something legendary.</text>
<text x="450" y="142" text-anchor="middle" class="t" font-size="15" fill="#9aa4bf">Got a mission? Web app, mobile app, or both, my scroll is open.</text>
<g class="spin"><path d="M450 160 L455 173 L468 178 L455 183 L450 196 L445 183 L432 178 L445 173 Z" fill="#c7cede"/><circle cx="450" cy="178" r="3" fill="#0b0d14"/></g>
</svg>